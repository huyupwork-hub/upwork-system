name: Hosted Supabase smoke test

# Two entry points, one definition:
#
#   workflow_dispatch — run the smoke test on its own, without building an APK.
#                       A 16-minute Gradle build to re-check a 5-second round
#                       trip is not a reasonable feedback loop.
#   workflow_call     — invoked by ci.yml so a full push run still includes it.
#
# The test itself lives in apps/mobile/test_hosted/hosted_smoke_test.dart and is
# not duplicated anywhere. Requires the six secrets in docs/SMOKE_TEST.md.

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  smoke:
    name: Sign in -> create -> read back -> isolation
    runs-on: [self-hosted, Linux, X64]
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get

      # test_hosted/ sits outside test/, so the hermetic suite never picks it up
      # and `flutter test` stays deterministic (K5).
      #
      # Credentials arrive as environment variables rather than --dart-define:
      # defines land in the process command line and in the step echo, env does not.
      - name: Hosted round trip
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SMOKE_USER_A_EMAIL: ${{ secrets.SMOKE_USER_A_EMAIL }}
          SMOKE_USER_A_PASSWORD: ${{ secrets.SMOKE_USER_A_PASSWORD }}
          SMOKE_USER_B_EMAIL: ${{ secrets.SMOKE_USER_B_EMAIL }}
          SMOKE_USER_B_PASSWORD: ${{ secrets.SMOKE_USER_B_PASSWORD }}
          # Carried in every fixture name and written into the manifest, so
          # the cleanup step below can bound its sweep to this run and
          # nothing else. The run id is unique, reaches both steps without
          # either telling the other, and makes a leaked row traceable to
          # the run that made it.
          SMOKE_RUN_TOKEN: run${{ github.run_id }}x${{ github.run_attempt }}
          SMOKE_MANIFEST: build/smoke-manifest.json
        run: flutter test test_hosted/ --reporter expanded

      # Runs whatever the test did, because the fixture most likely to be
      # stranded is the one a failing run created and never reached its own
      # cleanup for. The manifest is written as rows are created, so a run
      # that died halfway still names what it made.
      #
      # This step is why the leak is fixed rather than merely reduced.
      # Submit is one-way (D10) and the delete policy requires a draft (D17),
      # so the inspection case 22 submits on purpose cannot be removed by the
      # anon key that created it. No policy changes to accommodate that: a
      # separate step holds a privileged key instead, and the test process
      # never sees it — the smoke test still refuses to start under anything
      # but an anon key, which is the property it exists to prove.
      #
      # Without the secret the script warns and exits 0, so a fork or a fresh
      # clone that has never had one is not permanently red.
      - name: Purge this run's fixtures
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SMOKE_RUN_TOKEN: run${{ github.run_id }}x${{ github.run_attempt }}
          SMOKE_MANIFEST: build/smoke-manifest.json
        run: dart run tool/smoke_purge.dart
