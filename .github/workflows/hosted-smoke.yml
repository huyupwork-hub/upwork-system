name: Hosted Supabase smoke test

# Two entry points, one definition:
#
#   workflow_dispatch — run the smoke test on its own, without building an APK.
#                       A 16-minute Gradle build to re-check a 5-second round
#                       trip is not a reasonable feedback loop.
#   workflow_call     — invoked by ci.yml so a full push run still includes it.
#
# The test itself lives in apps/mobile/test_hosted/hosted_smoke_test.dart and is
# not duplicated anywhere. Requires the six secrets in docs/SMOKE_TEST.md.

on:
  workflow_dispatch:
  workflow_call:
    # Named one by one rather than taking `secrets: inherit` from the caller.
    # This list IS the boundary: the privileged cleanup key is not on it and
    # therefore cannot cross into this workflow from ci.yml, whatever the
    # repository happens to hold. The cleanup job below gets its key from a
    # GitHub Environment instead, which no other job declares.
    secrets:
      SUPABASE_URL:
        required: true
      SUPABASE_ANON_KEY:
        required: true
      SMOKE_USER_A_EMAIL:
        required: true
      SMOKE_USER_A_PASSWORD:
        required: true
      SMOKE_USER_B_EMAIL:
        required: true
      SMOKE_USER_B_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  smoke:
    name: Sign in -> create -> read back -> isolation
    runs-on: [self-hosted, Linux, X64]
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get

      # test_hosted/ sits outside test/, so the hermetic suite never picks it up
      # and `flutter test` stays deterministic (K5).
      #
      # Credentials arrive as environment variables rather than --dart-define:
      # defines land in the process command line and in the step echo, env does not.
      #
      # There is deliberately no privileged key in this env block. The test
      # decodes the key it is handed and refuses to start unless the claim is
      # `anon` — a privileged key would bypass RLS and every isolation assertion
      # in the file would pass while proving nothing.
      - name: Hosted round trip
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SMOKE_USER_A_EMAIL: ${{ secrets.SMOKE_USER_A_EMAIL }}
          SMOKE_USER_A_PASSWORD: ${{ secrets.SMOKE_USER_A_PASSWORD }}
          SMOKE_USER_B_EMAIL: ${{ secrets.SMOKE_USER_B_EMAIL }}
          SMOKE_USER_B_PASSWORD: ${{ secrets.SMOKE_USER_B_PASSWORD }}
          # Identifies the run that wrote the manifest, so the cleanup job can
          # tell this run's record from one left in a reused workspace. It is
          # not a delete filter: nothing is ever removed by name or pattern.
          SMOKE_RUN_TOKEN: run${{ github.run_id }}x${{ github.run_attempt }}
          SMOKE_MANIFEST: build/smoke-manifest.json
        run: flutter test test_hosted/ --reporter expanded

      # `if: always()` because the fixture most likely to be stranded belongs to
      # a run that failed partway. The manifest is flushed as each row is
      # created, so a run that died halfway still names what it made.
      #
      # It holds UUIDs and storage paths and nothing else — no credentials, no
      # user data.
      - name: Keep the run manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/mobile/build/smoke-manifest.json
          if-no-files-found: warn
          retention-days: 1

  # Cleanup is NOT a job here. It lives in .github/workflows/smoke-cleanup.yml,
  # triggered by workflow_run once this workflow — or the CI run that called it —
  # finishes.
  #
  # It was a job in this file, gated by an environment. It never ran. In a
  # workflow invoked with `workflow_call` the `secrets` context holds only what
  # the caller passed, and environment secrets are not merged in, so the
  # privileged key resolved to an empty string on every push and pull request
  # while resolving correctly on a manual dispatch. Passing the key down from
  # ci.yml would have fixed that by putting it in scope for this whole workflow,
  # including the smoke job above — which is the thing the separation exists to
  # prevent.
  #
  # The manifest uploaded above is how the two runs are joined.
