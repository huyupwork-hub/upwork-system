name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Gates are declared before the code they guard (Gate 0). Each job below runs only
  # once its slice exists. This is scope sequencing, not failure masking: a job that
  # runs and fails always fails the build, and `detect` prints exactly what was skipped.
  detect:
    name: Detect slices
    runs-on: ubuntu-latest
    outputs:
      mobile: ${{ steps.check.outputs.mobile }}
      admin: ${{ steps.check.outputs.admin }}
      supabase: ${{ steps.check.outputs.supabase }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          set -euo pipefail
          mobile=false; admin=false; supabase=false
          if [ -f apps/mobile/pubspec.yaml ]; then mobile=true; fi
          if [ -f apps/admin/package.json ]; then admin=true; fi
          if ls supabase/migrations/*.sql >/dev/null 2>&1; then supabase=true; fi
          echo "mobile=$mobile"   >> "$GITHUB_OUTPUT"
          echo "admin=$admin"     >> "$GITHUB_OUTPUT"
          echo "supabase=$supabase" >> "$GITHUB_OUTPUT"
          {
            echo "### Active gates"
            echo "| Gate | Active |"
            echo "|---|---|"
            echo "| Mobile (Flutter) | $mobile |"
            echo "| Admin (Next.js)  | $admin |"
            echo "| Database + RLS   | $supabase |"
          } >> "$GITHUB_STEP_SUMMARY"

  secrets:
    name: Secret hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No committed env files
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.example$'; then
            echo "::error::A .env file is tracked in git."
            exit 1
          fi
      - name: No service-role key in the tree
        run: |
          set -euo pipefail
          # Supabase service-role JWTs carry this claim; the anon key never does.
          if grep -rIn --exclude-dir=.git -e 'service_role' -- . \
             | grep -vE '(^|/)(docs/|README\.md|\.github/)' ; then
            echo "::error::Possible service-role credential outside documentation."
            exit 1
          fi

  database:
    name: Database + RLS
    needs: detect
    if: needs.detect.outputs.supabase == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase
        run: supabase start

      # L4 — proves migrations apply from an empty database to head, with no seed data
      # involved. A migration that only works against a pre-seeded database fails here.
      - name: Migrations apply cleanly from empty to head
        run: supabase db reset --no-seed

      # Re-apply with the deterministic fixtures the pgTAP suite asserts against.
      - name: Reset with seed fixtures
        run: supabase db reset

      - name: RLS / pgTAP suite
        run: supabase test db

      # K5 — determinism. Each test file runs in its own transaction and rolls back, so
      # a repeat run must produce identical results. Ordering dependence shows up here.
      - name: Suite is repeatable
        run: supabase test db && supabase test db

  mobile:
    name: Mobile (Flutter)
    needs: detect
    if: needs.detect.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Formatting
        run: dart format --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Test
        run: flutter test --coverage
      - name: Build release APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: fieldproof-android-${{ github.sha }}
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  ios:
    name: iOS build verification
    needs: detect
    if: needs.detect.outputs.mobile == 'true'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build (no codesign)
        run: flutter build ios --release --no-codesign

  admin:
    name: Admin (Next.js)
    needs: detect
    if: needs.detect.outputs.admin == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      - name: Assert no service-role key in the client bundle
        run: |
          set -euo pipefail
          if grep -rI 'service_role' .next/static 2>/dev/null; then
            echo "::error::service_role key leaked into the client bundle."
            exit 1
          fi
          echo "Client bundle clean."
