name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Gates are declared before the code they guard (Gate 0). Each job below runs only
  # once its slice exists. This is scope sequencing, not failure masking: a job that
  # runs and fails always fails the build, and `detect` prints exactly what was skipped.
  detect:
    name: Detect slices
    runs-on: [self-hosted, Linux, X64]
    outputs:
      mobile: ${{ steps.check.outputs.mobile }}
      admin: ${{ steps.check.outputs.admin }}
      supabase: ${{ steps.check.outputs.supabase }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          set -euo pipefail
          mobile=false; admin=false; supabase=false
          if [ -f apps/mobile/pubspec.yaml ]; then mobile=true; fi
          if [ -f apps/admin/package.json ]; then admin=true; fi
          if ls supabase/migrations/*.sql >/dev/null 2>&1; then supabase=true; fi
          echo "mobile=$mobile"   >> "$GITHUB_OUTPUT"
          echo "admin=$admin"     >> "$GITHUB_OUTPUT"
          echo "supabase=$supabase" >> "$GITHUB_OUTPUT"
          {
            echo "### Active gates"
            echo "| Gate | Active |"
            echo "|---|---|"
            echo "| Mobile (Flutter) | $mobile |"
            echo "| Admin (Next.js)  | $admin |"
            echo "| Database + RLS   | $supabase |"
          } >> "$GITHUB_STEP_SUMMARY"

  secrets:
    name: Secret hygiene
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - name: No committed env files
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.example$'; then
            echo "::error::A .env file is tracked in git."
            exit 1
          fi
      - name: No service-role key in the tree
        run: |
          set -euo pipefail
          # Supabase service-role JWTs carry this claim; the anon key never does.
          if grep -rIn --exclude-dir=.git -e 'service_role' -- . \
             | grep -vE '(^|/)(docs/|README\.md|\.github/)' ; then
            echo "::error::Possible service-role credential outside documentation."
            exit 1
          fi

  database:
    name: Database + RLS
    needs: detect
    if: needs.detect.outputs.supabase == 'true'
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4

      # The DB-only local path depends on Realtime staying off. The CLI runs the Realtime
      # seeder from inside database startup, gated on [realtime].enabled and not on the
      # "supabase start -x realtime" exclusion list, so re-enabling it here silently breaks
      # any machine whose CPU predates the image's instruction-set baseline (D11).
      - name: Realtime stays disabled in supabase/config.toml
        run: |
          set -euo pipefail
          section=$(awk '/^\[realtime\]/{f=1;next} /^\[/{f=0} f' supabase/config.toml)
          if ! printf '%s\n' "$section" | grep -qE '^[[:space:]]*enabled[[:space:]]*=[[:space:]]*false[[:space:]]*$'; then
            echo "::error::supabase/config.toml must keep [realtime] enabled = false (docs/DECISIONS.md D11)."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Runs the same four gates as before (L4 unseeded migration apply, seeded
      # re-apply, pgTAP suite, K5 repeat) through the script the service box already
      # uses, so the database gate has one definition rather than two that can drift.
      #
      # Note this brings up Postgres alone. The box cannot run the full service stack
      # (D11), so GoTrue, Storage, PostgREST, Kong, Studio and Edge Runtime are not
      # exercised here — the pgTAP suite needs none of them, but anything requiring a
      # live HTTP endpoint is now unverified by CI as well as locally.
      - name: Migrations, pgTAP, RLS
        env:
          SUPABASE_CMD: supabase
        run: ./scripts/db-verify.sh

  mobile:
    name: Mobile (Flutter)
    needs: detect
    if: needs.detect.outputs.mobile == 'true'
    runs-on: [self-hosted, Linux, X64]
    defaults:
      run:
        working-directory: apps/mobile
    # Caching on a self-hosted runner works the opposite way round to a hosted one.
    # These all persist on the box between runs, and `actions/checkout` only cleans
    # the workspace, never $HOME:
    #
    #   ~/.gradle                -> /data/gradle       Gradle dist + build cache
    #   ~/.pub-cache                                   pub packages
    #   ~/android-sdk                                  SDK, platforms, build-tools
    #   actions-runner/_work/_tool -> /data/runner-work  Flutter SDK + JDK
    #
    # So no actions/cache steps: on self-hosted they would upload and re-download
    # gigabytes over the network to replace a cache that is already on local disk.
    # The first cold Gradle build took 1263s; warm builds reuse ~/.gradle.
    # Do not add steps that clear these, and do not add parallelism — this box has
    # 5.6 GB of RAM and one runner, so jobs are deliberately serial.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Still fails the build on unformatted code. On failure it also emits the
      # exact patch as an artifact, because the development machine cannot run the
      # matching formatter (Dart 3.13 needs macOS 14; the machine is on 12 — D1).
      - name: Formatting
        run: |
          if ! dart format --set-exit-if-changed .; then
            git --no-pager diff > "$GITHUB_WORKSPACE/format.patch"
            # An empty diff here means dart format did not reformat anything —
            # it failed outright, which almost always means a file could not be
            # parsed. Saying 'not formatted' in that case sends the reader to an
            # empty artifact instead of to the syntax error above.
            if [ -s "$GITHUB_WORKSPACE/format.patch" ]; then
              echo '::error::Code is not formatted. Download the format-patch artifact and apply it.'
            else
              echo '::error::dart format could not parse a source file. See the output above; there is no patch to apply.'
            fi
            exit 1
          fi

      - name: Upload format patch
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: format-patch
          path: format.patch
          if-no-files-found: ignore
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Test
        run: flutter test --coverage
      # Platform scaffolding is a generated artifact, not source (D12): no Flutter
      # toolchain existed on the machine that wrote this app, and hand-committing a
      # binary gradle wrapper would be worse than regenerating it here.
      - name: Generate Android scaffolding
        run: |
          set -euo pipefail
          flutter create --platforms=android --org com.fieldproof --project-name fieldproof .
          # flutter create rewrites template-owned files; ours win.
          git checkout -- lib test pubspec.yaml analysis_options.yaml
          # The template grants INTERNET only in the debug and profile manifests, so a
          # release build would have no network and every Supabase call would fail.
          manifest=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.INTERNET' "$manifest"; then
            perl -0pi -e 's|<manifest([^>]*)>|<manifest$1>\n    <uses-permission android:name="android.permission.INTERNET"/>|' "$manifest"
          fi
          grep -q 'android.permission.INTERNET' "$manifest"

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: fieldproof-android-${{ github.sha }}
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  hosted-smoke:
    name: Hosted Supabase smoke test
    needs: detect
    # Opt-in via the HOSTED_SMOKE repository variable, and absent rather than red
    # when unconfigured: a job that fails on every commit for an environmental
    # reason teaches people to ignore red (D15). Needs the six secrets in
    # docs/SMOKE_TEST.md; a fork or a fresh clone has neither, and simply skips.
    if: needs.detect.outputs.mobile == 'true' && vars.HOSTED_SMOKE == 'true'
    # Calls the same definition the standalone workflow uses, so the steps exist
    # once. It does NOT depend on the mobile job — a smoke-only invocation is a
    # `workflow_dispatch` on hosted-smoke.yml and rebuilds no APK.
    uses: ./.github/workflows/hosted-smoke.yml
    # Named one by one rather than `secrets: inherit`. Inherit hands the
    # called workflow everything this repository holds, which would include
    # the privileged cleanup key. This list is the boundary, and it is short
    # enough to read: the key is not on it, so it cannot reach the smoke job.
    # The cleanup job takes its key from a GitHub Environment instead.
    secrets:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SMOKE_USER_A_EMAIL: ${{ secrets.SMOKE_USER_A_EMAIL }}
      SMOKE_USER_A_PASSWORD: ${{ secrets.SMOKE_USER_A_PASSWORD }}
      SMOKE_USER_B_EMAIL: ${{ secrets.SMOKE_USER_B_EMAIL }}
      SMOKE_USER_B_PASSWORD: ${{ secrets.SMOKE_USER_B_PASSWORD }}

  # iOS lives in .github/workflows/ios.yml — it needs a macOS runner, which this
  # workflow has no execution path to. Keeping it here left a permanently red job
  # that said nothing about the code, which devalues every other signal in the run.

  admin:
    name: Admin (Next.js)
    needs: detect
    if: needs.detect.outputs.admin == 'true'
    runs-on: [self-hosted, Linux, X64]
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      - name: Assert no service-role key in the client bundle
        run: |
          set -euo pipefail
          if grep -rI 'service_role' .next/static 2>/dev/null; then
            echo "::error::service_role key leaked into the client bundle."
            exit 1
          fi
          echo "Client bundle clean."
