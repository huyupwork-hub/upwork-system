include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    # CI runs `flutter analyze --fatal-infos`; keep the bar there rather than here.
    todo: ignore

linter:
  rules:
    - prefer_final_locals
    - unawaited_futures
    - always_declare_return_types
